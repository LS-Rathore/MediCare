name: Keep-Alive Pinger

on:
  schedule:
    # Runs every 14 minutes to prevent Render free instances from sleeping (15-minute inactivity limit)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Medicare Backend API
        run: |
          echo "Pinging Backend..."
          curl -s -o /dev/null -w "%{http_code}" https://medicare-backend-g8rx.onrender.com/

      - name: Ping Medicare Frontend App
        run: |
          echo "Pinging Frontend..."
          curl -s -o /dev/null -w "%{http_code}" https://medicare-frontend-38hg.onrender.com/

      - name: Ping Medicare Admin Portal
        run: |
          echo "Pinging Admin..."
          curl -s -o /dev/null -w "%{http_code}" https://medicare-admin-i33y.onrender.com/
